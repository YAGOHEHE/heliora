[package]
name = "heliora"
version = "1.0.0"
edition = "2021"
description = "Cálculo técnico y simulación por bloques para plantas solares fotovoltaicas"
license = "MIT"

[[bin]]
name = "heliora"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
