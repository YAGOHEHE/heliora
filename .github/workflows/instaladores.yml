name: Instaladores

# Instalador de Windows (.exe) y imagen de macOS (.dmg) con Python y sus librerías incluidos.
# En cada push a main quedan como artefactos de la ejecución; con una etiqueta v* se publican
# además en una Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Versión
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-${GITHUB_SHA::7}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Compilar la aplicación
        run: cargo build --release
      - name: Motor con Python incluido
        run: |
          mkdir -p dist/Heliora
          cp target/release/heliora.exe dist/Heliora/
          bash packaging/preparar_motor.sh dist/Heliora x86_64-pc-windows-msvc
      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Instalador
        shell: pwsh
        working-directory: packaging/windows
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DVersion=$env:VERSION" "/DOrigen=..\..\dist\Heliora" "/DSalida=..\..\dist" heliora.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Heliora-windows
          path: dist/Heliora-Setup-*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versión
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-${GITHUB_SHA::7}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Compilar la aplicación
        run: cargo build --release
      - name: Paquete Heliora.app
        run: |
          APP=dist/Heliora.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/heliora "$APP/Contents/MacOS/"
          # CFBundleVersion debe ser numérico (x.y.z); la versión visible lleva el commit en las compilaciones de main
          NUMERO="${VERSION%%-*}"
          sed -e "s/VERSION_NUMERO/${NUMERO}/g" -e "s/VERSION/${VERSION}/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          # Icono .icns a partir del PNG de 512 px
          ICONOS=dist/heliora.iconset
          mkdir -p "$ICONOS"
          for t in 16 32 64 128 256 512; do
            sips -z $t $t icon/icon_512.png --out "$ICONOS/icon_${t}x${t}.png" > /dev/null
            d=$((t * 2))
            if [ $d -le 512 ]; then sips -z $d $d icon/icon_512.png --out "$ICONOS/icon_${t}x${t}@2x.png" > /dev/null; fi
          done
          iconutil -c icns "$ICONOS" -o "$APP/Contents/Resources/heliora.icns"
          bash packaging/preparar_motor.sh "$APP/Contents/Resources" aarch64-apple-darwin
          # Firma ad hoc (sin certificado): en Apple Silicon es obligatoria para que la app arranque
          codesign --force --deep --sign - "$APP"
      - name: Imagen .dmg
        run: |
          mkdir -p dist/dmg
          cp -R dist/Heliora.app dist/dmg/
          ln -s /Applications dist/dmg/Aplicaciones
          hdiutil create -volname "Heliora" -srcfolder dist/dmg -ov -format UDZO "dist/Heliora-${VERSION}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Heliora-macos
          path: dist/Heliora-*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
      - name: Publicar la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artefactos/*/* --repo "$GITHUB_REPOSITORY" --title "Heliora ${GITHUB_REF_NAME}" --generate-notes
